
name: FinTrack Pro Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Flutter platforms
        run: flutter create --platforms=android,ios --org com.fintrackpro .

      - name: Get dependencies
        run: flutter pub get
     
      - name: Remove default test
        run: rm -rf test
      
      - name: Analyze
        run: flutter analyze

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FinTrack-Pro-APK
          path: build/app/outputs/flutter-apk/app-release.apk
